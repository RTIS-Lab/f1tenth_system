/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    speed_to_erpm_gain: 4400.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -1.2135
    # steering_angle_to_servo_offset: 0.5304
    steering_angle_to_servo_offset: 0.55

    port: /dev/sensors/vesc
    imu_frame: vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 43250.0
    position_min: 0.0
    position_max: 0.0
    # Steering servo command bounds. ackermann_to_vesc uses these, together
    # with steering_angle_to_servo_offset, to derive a *symmetric* steering
    # limit: travel is 0.40 servo units left of the 0.55 offset but only 0.30
    # right, so the usable steering angle is +/-0.247 rad unless servo_max is
    # widened (check the linkage before going past ~0.95).
    servo_min: 0.15
    servo_max: 0.85

    # Measurement noise published on /sensors/imu/raw (variances, not std-devs).
    # Must be non-zero: robot_localization clamps a zero variance to 1e-9 and
    # then treats the measurement as exact.
    imu_orientation_variance: 1.0e-2          # ~0.1 rad (no absolute heading ref)
    imu_angular_velocity_variance: 4.0e-4     # ~0.02 rad/s
    imu_linear_acceleration_variance: 4.0e-2  # ~0.2 m/s^2

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    # car wheelbase is about 25cm
    wheelbase: .25
    # Twist covariance reported to the EKF (variances). vx/vy are the erpm and
    # nonholonomic-constraint noise; the yaw-rate std-dev is
    #   base + scale*|vyaw|  combined with  v * steer_rate * servo_lag / L,
    # i.e. small once the servo has settled, large while it is still slewing.
    # twist_cov_yaw_scale is currently absorbing the wheelbase mismatch above:
    # drop it to ~0.05 after measuring the real wheelbase.
    twist_cov_vx: 0.01
    twist_cov_vy: 0.0025
    twist_cov_yaw_base: 0.03
    twist_cov_yaw_scale: 0.25
    servo_lag_s: 0.10
    # Override the symmetric steering limit derived from servo_min/servo_max.
    # steering_angle_max: 0.2472

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:
