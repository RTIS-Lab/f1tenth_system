# AMCL localization against a known static map.
#
# Loaded by fusion.launch.py when localization_mode:=amcl. In that mode the
# ODOM EKF owns odom -> base_link (publish_tf overridden to true by the
# launch file), and AMCL listens to the odom -> base_link tf chain plus the
# raw /scan and publishes map -> odom as the global correction. This is the
# textbook REP-105 split: odom is short-term-smooth dead reckoning; map is
# long-term-correct global.
#
# Resulting tf chain:
#   map -> odom -> base_link -> vesc -> vesc_imu
#
# The alternative flow (localization_mode:=lidar_odom, the default) instead
# runs rtis_lidar_odom, which produces a drift-bounded odom -> base_link and
# has no map frame. amcl.yaml is not loaded in that mode.
amcl:
    ros__parameters:
        # Frames aligned with fusion.yaml / rtis_lidar_odom defaults.
        global_frame_id: map
        odom_frame_id: odom
        base_frame_id: base_link
        scan_topic: /scan
        map_topic: map

        # Differential is the closest match for an Ackermann car at speed
        # (no omnidirectional motion; sideslip assumed negligible by the
        # flat-ground 2D model). nav2_amcl uses this to choose the motion
        # model used for particle propagation between scan updates.
        robot_model_type: nav2_amcl::DifferentialMotionModel

        # Particle filter sizing. F1Tenth operates in bounded racetracks
        # with a known starting pose, so we don't need a huge swarm.
        min_particles: 100
        max_particles: 2000
        pf_err: 0.05
        pf_z: 0.99
        pf_z_short: 0.05
        pf_z_max: 0.05
        pf_z_rand: 0.5
        pf_z_short_exp: 0.1
        pf_z_max_exp: 0.05
        pf_z_rand_exp: 0.05
        recovery_alpha_slow: 0.001
        recovery_alpha_fast: 0.1

        # Lidar sensor model. The SICK on this car sees ~20 m useful range;
        # subsample to ~60 beams to keep AMCL cheap enough on the Jetson at
        # race speeds. Adjust laser_max_range down to 10-12 m on small maps
        # to reduce phantom hits beyond walls.
        laser_max_beams: 120
        laser_max_range: 30.0
        laser_min_range: 0.05
        laser_z_hit: 0.95
        laser_z_short: 0.1
        laser_z_max: 0.05
        laser_z_rand: 0.05
        laser_sigma_hit: 0.2
        laser_lambda_short: 0.1
        laser_likelihood_max_dist: 2.0

        # Motion model noise (odom -> base_link delta). These act as a
        # tunable knob on "how much should the pf trust the odometry chain
        # between scans". F1Tenth wheel odometry slips noticeably under
        # hard cornering, so alpha{1,4} (rotational noise from rotation
        # and translation-noise off rotation) are sized larger than the
        # nav2 defaults.
        odom_alpha1: 0.20    # rot noise from rot motion (rad/rad)^2
        odom_alpha2: 0.20    # rot noise from trans motion  (rad/m)^2
        odom_alpha3: 0.20    # trans noise from trans motion (m/m)^2
        odom_alpha4: 0.25    # trans noise from rot motion (m/rad)^2
        odom_alpha5: 0.20    # extra mixed-rotation noise (differential model)

        # Update gating. Aggressive (small) values make AMCL track a race
        # car more closely but use more CPU at speed; bump up if you see
        # the Jetson saturate.
        update_min_d: 0.025
        update_min_a: 0.01
        resample_interval: 1
        transform_tolerance: 0.5
        save_pose_rate: 0.5

        # tf broadcasting. With this enabled, AMCL publishes map -> odom.
        # The lidar odom node continues to own odom -> base_link.
        tf_broadcast: true
        always_restart_initialization: false

        # Initial-pose handling. We DO NOT auto-set the initial pose here;
        # users should either:
        #   1) publish geometry_msgs/PoseWithCovarianceStamped to /initialpose
        #      in RViz, or
        #   2) enable set_initial_pose below + initial_pose.{x,y,z,yaw} when
        #      a known dock pose exists, or
        #   3) call the global_localization service via
        #      `ros2 service call /global_localization std_srvs/Empty`
        #      if starting pose is unknown.
        set_initial_pose: false
        initial_pose:
            x: 0.0
            y: 0.0
            z: 0.0
            yaw: 0.0

map_server:
    ros__parameters:
        # Forwarded to nav2_map_server. The yaml_filename is set by the
        # launch file from the `map` launch arg, not here, since it must be
        # an absolute filesystem path.
        frame_id: map
        topic_name: map
        yaml_filename: ""    # set by fusion.launch.py when localization_mode:=amcl
