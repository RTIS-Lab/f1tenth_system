# Nav2 navigation stack for the F1TENTH car (ROS 2 Humble).
#
# Used by navigation.launch.py. This file configures ONLY the navigation
# servers. Localization (map_server + amcl + odom EKF) is owned by
# fusion.launch.py localization_mode:=amcl, and the drive path (teleop twist
# bridge -> safety stack -> vesc) lives in the drive container.
#
# Topology:
#   bt_navigator      /navigate_to_pose action; subscribes /goal_pose, which
#                     RViz's "2D Goal Pose" tool publishes -- clicking a
#                     point drives there (a new click preempts the old goal).
#   planner_server    SmacPlannerHybrid (DUBIN, curvature-constrained A*)
#   controller_server RegulatedPurePursuit (Ackermann-friendly path tracking)
#   velocity_smoother /cmd_vel_nav (controller output) -> /cmd_vel, the
#                     acceleration-limited Twist the teleop bridge consumes.
#   teleop bridge     (drive container) /cmd_vel -> /teleop/drive Ackermann,
#                     only while the RUN_AUTO joystick button is held.
#
# Consistency requirements:
#   - minimum_turning_radius (planner) vs the teleop bridge's wheelbase +
#     max_steering_angle: R = wheelbase / tan(max_steer). Current values
#     assume 0.25 m / 0.34 rad -> R ~= 0.71 m. MEASURE both on the car
#     (ego_racecar.xacro says the wheelbase is 0.3302, which gives 0.93 m).
#   - resolution must match the map files (labmap.yaml: 0.05).
#   - inflation_cost_scaling_factor (RPP) must equal the local costmap
#     inflation layer's cost_scaling_factor (both 5.0 here).
#
# Start slow (desired_linear_vel 0.5 m/s) and raise from there.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # default_nav_to_pose_bt_xml is injected by navigation.launch.py ->
    # launch/navigate_to_pose_ackermann.xml (the default Nav2 BT minus the
    # Spin and BackUp recoveries, which this car cannot perform).
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # RPP has no rotate-to-goal behavior, so keep the yaw tolerance loose;
    # goal success is effectively position-based.
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 1.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.25
      lookahead_dist: 1.0
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      # Velocity-scaled lookahead (adaptive pure pursuit): at 0.5 m/s the
      # 1.5 s gain gives 0.75 m, inside the [0.3, 0.9] clamp.
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      # Nonholonomic: never rotate in place. allow_reversing lets RPP track
      # the reverse segments of REEDS_SHEPP plans (K-turns); it is mutually
      # exclusive with use_rotate_to_heading in RPP.
      use_rotate_to_heading: false
      allow_reversing: true
      # Curvature regulation: slow down when the pursuit arc is sharper than
      # regulated_linear_scaling_min_radius, down to the min speed.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.4
      # Proximity regulation near walls. inflation_cost_scaling_factor MUST
      # equal the local costmap inflation cost_scaling_factor (5.0 below).
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      # Slow on approach to the goal.
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      # Forward-simulated collision checking along the pursuit arc
      # (visualized on the controller's /lookahead_arc topic).
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_interpolation: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Approximate body, padded -- MEASURE and adjust. base_link sits at
      # the rear axle; the laser is +0.275 m ahead of it, the nose further.
      # Roughly 0.63 m x 0.32 m total.
      footprint: "[[0.45, 0.16], [0.45, -0.16], [-0.18, -0.16], [-0.18, 0.16]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # Unknown space is tracked and (via the planner's allow_unknown:
      # false) never traversed -- plans stay inside the mapped area.
      track_unknown_space: true
      footprint: "[[0.45, 0.16], [0.45, -0.16], [-0.18, -0.16], [-0.18, 0.16]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # Matches the latched QoS of the map_server started by
        # fusion.launch.py localization_mode:=amcl.
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      # Known-map navigation: never traverse unknown space.
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      # Ackermann: REEDS_SHEPP search over SE(2) -- paths may contain
      # reverse segments (K-turns), which RPP tracks via allow_reversing.
      # reverse_penalty (below) discourages reversing; tune in 1.3-5.0.
      motion_model_for_search: "REEDS_SHEPP"
      # R = wheelbase / tan(max_steer) = 0.25/tan(0.34) ~= 0.71 -> 0.75 with
      # margin. Never set below the true vehicle limit; MEASURE the real
      # wheelbase and max steering (xacro says 0.3302 m -> 0.93 m).
      minimum_turning_radius: 0.75
      analytic_expansion_ratio: 3.5
      # ~4-5x the minimum turning radius, per the nav2_smac docs.
      analytic_expansion_max_length: 4.0
      angle_quantization_bins: 64
      cost_travel_multiplier: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      # Only consulted by REEDS_SHEPP; kept for the future switch.
      reverse_penalty: 2.1
      lookup_table_size: 20.0
      cache_obstacle_heuristic: True
      # Smooth inside the planner (collision-checked gradient smoother).
      # The smoother_server's SimpleSmoother is NOT kinematics-aware and
      # would round corners beyond the turning radius -- the BT does not
      # call it for Ackermann paths.
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    # Part of the standard nav2 lifecycle set but unused by the current BT
    # (smoothing happens inside SmacPlannerHybrid, see above).
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Only "wait" is Ackermann-safe: spin is impossible, and backing up
    # stays off until the planner moves to REEDS_SHEPP.
    behavior_plugins: ["wait", "backup"]
    wait:
      plugin: "nav2_behaviors/Wait"
    backup:
      plugin: "nav2_behaviors/BackUp"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Headroom above RPP's desired_linear_vel (0.5). This node is the
    # acceleration authority -- the teleop bridge does no rate limiting.
    # NOTE: min_velocity[0] caps REVERSE at 0.25 m/s while RPP commands up
    # to -desired_linear_vel (-0.5) on reverse segments -- a deliberate
    # reverse-speed cap; raise toward -0.5 if reverse tracking looks
    # sluggish (the car will back up faster).
    max_velocity: [1.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.5]
    max_decel: [-2.5, 0.0, -3.2]
    # Only read in CLOSED_LOOP feedback mode.
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    # Deadband matches the teleop bridge's MIN_STEERING_SPEED (0.05 m/s) so
    # sub-threshold commands become exact zeros instead of straight crawls.
    deadband_velocity: [0.05, 0.0, 0.02]
    # Second stop layer: zero output 1 s after cmd_vel stops arriving. (The
    # teleop bridge's watchdog in the drive container is the first.)
    velocity_timeout: 1.0
